<section class="section" id="services">
  <div class="container">
    {% include section-heading.html eyebrow="Here for you" title="Special services" description="Get in touch with our church to discuss a service or a hall booking." %}
    <div class="services-grid">
      {% for service in site.data.services %}
        <article class="service-card">
          <img src="{{ service.image | relative_url }}" width="600" height="400" alt="" loading="lazy">
          <div class="service-copy">
            <h3>{{ service.title }}</h3>
            <p>{{ service.description }}</p>
            <a class="text-link" href="mailto:{{ site.data.church.email }}?subject={{ service.subject | uri_escape }}" aria-label="Enquire about {{ service.title | downcase }}">Make an enquiry →</a>
          </div>
        </article>
      {% endfor %}
    </div>
  </div>
</section>

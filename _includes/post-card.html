<article class="content-card">
  <p class="meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%B %-d, %Y' }}</time></p>
  <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
  <p>{{ post.excerpt | strip_html | truncatewords: 28 }}</p>
  <a class="text-link" href="{{ post.url | relative_url }}" aria-label="Read {{ post.title | escape }}">Read more →</a>
</article>

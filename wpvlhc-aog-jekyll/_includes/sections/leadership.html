<section class="section" id="leadership">
  <div class="container">
    {% include section-heading.html eyebrow="Our church" title="Leadership" %}
    <div class="leadership-grid">
      {% for leader in site.data.leadership %}
        <article class="leader-card">
          <img src="{{ leader.image | relative_url }}" width="443" height="517" alt="{{ leader.name | escape }}" loading="lazy">
          <div class="leader-copy">
            <h3>{{ leader.name }}</h3>
            <p>{{ leader.role }}</p>
            {% if leader.facebook_url != '' %}<a class="text-link" href="{{ leader.facebook_url }}" aria-label="{{ leader.name }} on Facebook">Facebook <span aria-hidden="true">↗</span></a>{% endif %}
          </div>
        </article>
      {% endfor %}
    </div>
  </div>
</section>

---
layout: default
---
<header class="page-heading">
  <div class="container">
    <p class="eyebrow">{{ page.eyebrow | default: site.title }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    <span class="accent-rule" aria-hidden="true"></span>
  </div>
</header>
<div class="container page-content{% if page.wide %} page-content-wide{% endif %}">
  {{ content }}
</div>

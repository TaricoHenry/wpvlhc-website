name: Check site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        baseurl: ["", "/preview-site"]
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build
        env:
          JEKYLL_ENV: production
          SITE_BASEURL: ${{ matrix.baseurl }}
        run: bundle exec jekyll build --strict_front_matter --baseurl "$SITE_BASEURL"
      - name: Check local pages and assets
        env:
          SITE_BASEURL: ${{ matrix.baseurl }}
        run: python3 scripts/check_site.py --baseurl "$SITE_BASEURL"
